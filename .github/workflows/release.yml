name: Release Package

# Starts when a correctly formatted version tag is pushed.
# Packaging is version-aligned: the package major tracks the Umbraco major, so the
# project to pack is selected from the tag's leading major number:
#   tag 17.2.3      -> Umbraco.Community.AI.LogAnalyser.v17  (Umbraco [17,18))
#   tag 18.0.0      -> Umbraco.Community.AI.LogAnalyser.v18  (Umbraco [18,19))
# Both variants build the same sources and publish under one PackageId.
# Both stable (1.2.3) and prerelease (1.2.3-rc1) tags are supported.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: 10.0.x

      - name: Select package project from tag major
        id: project
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          case "$major" in
            17) path="src/Umbraco.Community.AI.LogAnalyser.v17/Umbraco.Community.AI.LogAnalyser.v17.csproj"
                tests="src/Umbraco.Community.AI.LogAnalyser.Tests.v17/Umbraco.Community.AI.LogAnalyser.Tests.v17.csproj" ;;
            18) path="src/Umbraco.Community.AI.LogAnalyser.v18/Umbraco.Community.AI.LogAnalyser.v18.csproj"
                tests="src/Umbraco.Community.AI.LogAnalyser.Tests.v18/Umbraco.Community.AI.LogAnalyser.Tests.v18.csproj" ;;
            *)  echo "::error::Tag major '$major' has no matching package project (expected 17 or 18)." && exit 1 ;;
          esac
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "path=$path"   >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

      # Gate the release on the suite for the major being published, so a broken tag cannot
      # reach NuGet. The test project references the same package project that is packed below.
      - name: Test
        run: dotnet test ${{steps.project.outputs.tests}} -c Release

      - name: Build & Pack
        run: dotnet pack ${{steps.project.outputs.path}} -c Release /p:Version=${{github.ref_name}} -o ${{github.workspace}}/artifacts

      - name: Push to NuGet
        run: dotnet nuget push "${{github.workspace}}/artifacts/*.nupkg" -k ${{secrets.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json
